name: Build Electron with V4L2 Support

on:
  workflow_dispatch:
    inputs:
      electron_version:
        description: 'Electron version to build'
        required: false
        default: '43.1.1'

env:
  ELECTRON_VERSION: ${{ github.event.inputs.electron_version || '43.1.1' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld \
            libgtk-3-dev libnotify-dev libnss3-dev \
            libxss-dev libxtst-dev libatspi2.0-dev \
            libdrm-dev libgbm-dev libasound2-dev \
            libcap-dev libcups2-dev libdbus-1-dev \
            libglib2.0-dev libpulse-dev \
            v4l-utils libv4l-dev

      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH
          export DEPOT_TOOLS_UPDATE=0

      - name: Fetch source
        run: |
          mkdir -p build && cd build
          gclient config --name "src/electron" \
            --unmanaged https://github.com/${{ github.repository }}
          gclient sync --with_branch_heads --with_tags \
            -D --force --reset -R

      - name: Generate build args
        working-directory: build/src
        run: |
          mkdir -p out/Release
          cat > out/Release/args.gn << 'GNARGS'
          import("//electron/build/args/release.gn")

          # Target platform
          target_cpu = "arm64"
          target_os = "linux"

          # V4L2 hardware video decode (KEY!)
          use_v4l2_codec = true
          use_vaapi = false
          use_v4lplugin = true
          use_linux_v4l2_only = true

          # Codec support
          proprietary_codecs = true
          ffmpeg_branding = "Chrome"

          # Build type
          is_official_build = true
          is_debug = false
          symbol_level = 0
          GNARGS
          gn gen out/Release
          cat out/Release/args.gn

      - name: Build Electron
        working-directory: build/src
        run: |
          ninja -C out/Release electron:electron

      - name: Package
        working-directory: build/src
        run: |
          ninja -C out/Release electron:electron_dist_zip

      - name: Verify V4L2 support
        working-directory: build/src
        run: |
          echo "=== Checking V4L2 in built binary ==="
          strings out/Release/electron | grep -c "V4L2VideoDecoder" || true
          strings out/Release/electron | grep "media/gpu/v4l2" | head -5 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-v4l2-arm64-linux
          path: |
            build/src/out/Release/dist/*.zip
            build/src/out/Release/electron
          retention-days: 30
